# Full local stack: Postgres + API + worker. Local development only (no TLS, no encryption-at-rest claim).
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: finassist, POSTGRES_PASSWORD: finassist, POSTGRES_DB: finassist}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ../backend/db/migrations/0001_core.sql:/docker-entrypoint-initdb.d/0001_core.sql:ro
  api:
    build: ../backend
    env_file: ../.env
    environment:
      FINASSIST_DATABASE_URL: postgresql://finassist:finassist@db:5432/finassist
      FINASSIST_STORAGE_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["127.0.0.1:8000:8080"]
    depends_on: [db]
  worker:
    build: ../backend
    command: ["python", "-m", "finassist.worker"]
    env_file: ../.env
    environment:
      FINASSIST_DATABASE_URL: postgresql://finassist:finassist@db:5432/finassist
      FINASSIST_STORAGE_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: [db]
volumes:
  uploads: {}
