# Local development database only. Not a deployment; no encryption-at-rest claim applies.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finassist
      POSTGRES_PASSWORD: finassist   # local dev only
      POSTGRES_DB: finassist
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
