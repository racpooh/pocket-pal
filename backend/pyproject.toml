[project]
name = "finassist"
version = "0.0.1"
description = "FinTechathon 2026 Topic A personal finance assistant backend (prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
    "argon2-cffi>=23,<26",
    "python-multipart>=0.0.9",
    "pillow>=10,<13",
    "anthropic>=0.40,<1",
    "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
gcp = ["google-cloud-storage>=2.16,<4"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "qrcode>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: requires a disposable Postgres at TEST_DATABASE_URL (skipped otherwise)",
]
